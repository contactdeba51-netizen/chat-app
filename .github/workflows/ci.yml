name: CI

# Runs on every push to main, every pull request, and on demand. Pushes to main
# verify and then deploy the same commit. Pull requests only verify.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Verify runs may cancel each other for the same ref. The deploy job below
    # has its own group so a new push can never cancel a production deploy.
    concurrency:
      group: ci-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    services:
      # A disposable database for this run only. It is never reachable from the
      # internet and holds no production data.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chat_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Hard-coded on purpose: tests cannot be pointed at Neon or Render even if
      # a repository variable is changed by mistake.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_app_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_app_ci
      DATABASE_SSL: "false"
      NODE_ENV: test
      # Throwaway values, valid only inside this job. They are distinct because
      # the production guard refuses a shared JWT/media secret.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      MEDIA_SECRET: ci-only-media-secret-0123456789abcdef0123456789abcdef
      MEDIA_DRIVER: local
      CLIENT_URL: http://localhost:5173
      # Smoke, security, and browser tests all authenticate from one runner IP.
      LOGIN_RATE_LIMIT: "2000"
      CODE_RATE_LIMIT: "1000"
      UPLOAD_RATE_LIMIT: "200"
      UPLOAD_IP_RATE_LIMIT: "400"

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Refuse any non-local test database
        run: |
          node - <<'NODE'
          for (const name of ['DATABASE_URL', 'DIRECT_DATABASE_URL']) {
            const url = new URL(process.env[name])
            const local = ['localhost', '127.0.0.1', '::1'].includes(url.hostname)
            const expectedDatabase = url.pathname === '/chat_app_ci'
            if (!local || !expectedDatabase) {
              console.error(`Refusing to run: ${name} points at ${url.hostname}${url.pathname}, not the disposable local test database.`)
              process.exit(1)
            }
            console.log(`${name}: ${url.hostname}${url.pathname}`)
          }
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend JavaScript syntax checks
        id: syntax
        working-directory: backend
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "Checked $(find src scripts -name '*.js' | wc -l) files."

      - name: Apply database migrations
        id: migrate
        working-directory: backend
        run: npm run db:migrate

      - name: Assert no migrations are pending
        id: migrations
        working-directory: backend
        run: |
          npm run db:status | tee /tmp/db-status.txt
          grep -q '0 pending' /tmp/db-status.txt
          echo "Schema is fully migrated."

      - name: Start the API and wait for health
        id: backend
        working-directory: backend
        run: |
          npm start > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:5000/healthz > /dev/null; then
              echo "API ready after ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "The API did not become healthy."
          tail -n 120 /tmp/backend.log
          exit 1

      - name: Smoke tests
        id: smoke
        working-directory: backend
        run: npm run smoke

      - name: Security regression tests
        id: security
        working-directory: backend
        run: npm run security:check

      - name: Production frontend build
        id: build
        working-directory: frontend
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        id: e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show API log on failure
        if: failure()
        run: tail -n 200 /tmp/backend.log || true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## CI result: ${{ job.status }}"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Backend syntax | ${{ steps.syntax.outcome }} |"
            echo "| Migrations applied | ${{ steps.migrate.outcome }} |"
            echo "| No pending migrations | ${{ steps.migrations.outcome }} |"
            echo "| API health | ${{ steps.backend.outcome }} |"
            echo "| Smoke tests | ${{ steps.smoke.outcome }} |"
            echo "| Security tests | ${{ steps.security.outcome }} |"
            echo "| Frontend build | ${{ steps.build.outcome }} |"
            echo "| Playwright tests | ${{ steps.e2e.outcome }} |"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Database: disposable PostgreSQL 17 container on \`localhost\` (no production credentials)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Render
    # Pushes to main deploy only after Verify succeeds. Pull requests never
    # deploy. A manual dispatch on main remains available for the emergency
    # path. The job deploys github.sha, the exact commit this run verified.
    if: needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # One production deployment at a time: a second deploy waits instead of
    # cancelling or racing the running one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TARGET_COMMIT: ${{ github.sha }}
      RENDER_API_SERVICE_ID: srv-dbjl9lc9v7es73aeeqs0
      RENDER_WEB_SERVICE_ID: srv-dbjla58u01pc73fqe5kg
      RENDER_API_BASE: https://api.render.com/v1

    steps:
      - name: Require the Render credential
        id: credential
        run: |
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::The RENDER_API_KEY repository secret is not set. Add it under Settings -> Secrets and variables -> Actions -> New repository secret, then run this workflow again."
            exit 1
          fi
          echo "Render credential is present."

      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the deployment commit
        id: commit
        run: |
          set -euo pipefail
          if [ "$TARGET_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to deploy $TARGET_COMMIT: this run verified $GITHUB_SHA."
            exit 1
          fi
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TARGET_COMMIT" ]; then
            echo "::error::Checked out $checked_out but expected $TARGET_COMMIT."
            exit 1
          fi
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is not available in the checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_COMMIT" origin/main; then
            echo "::error::Commit $TARGET_COMMIT is not reachable from main."
            exit 1
          fi
          echo "Verify passed for $TARGET_COMMIT in this run and the same commit is checked out."

      - name: Install Render helpers
        run: |
          cat > "$RUNNER_TEMP/render.sh" <<'RENDER_HELPERS'
          fail() {
            echo "::error::$*"
            exit 1
          }

          render_get() {
            local path="$1" attempt body status
            for attempt in 1 2 3; do
              body=$(curl -sS --max-time 30 \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Accept: application/json" \
                -w $'\n%{http_code}' \
                "$RENDER_API_BASE$path" || true)
              status="${body##*$'\n'}"
              body="${body%$'\n'*}"
              if [ "$status" = "200" ]; then
                printf '%s' "$body"
                return 0
              fi
              echo "Render GET $path returned HTTP ${status:-unknown}; retrying." >&2
              sleep 5
            done
            echo "::error::Render GET $path failed after 3 attempts."
            return 1
          }

          is_terminal_status() {
            case "$1" in
              live|deactivated|canceled|build_failed|update_failed|pre_deploy_failed) return 0 ;;
              *) return 1 ;;
            esac
          }

          wait_for_idle() {
            local id="$1" name="$2" attempt body active
            for attempt in $(seq 1 120); do
              body=$(render_get "/services/$id/deploys?limit=10") || return 1
              active=$(printf '%s' "$body" | jq '[ .[] | (.deploy // .) | select(((.status) | IN("live","deactivated","canceled","build_failed","update_failed","pre_deploy_failed")) | not) ] | length')
              if [ "${active:-1}" -eq 0 ]; then
                echo "$name has no active deployments."
                return 0
              fi
              echo "$name still has $active active deployment(s); waiting."
              sleep 10
            done
            echo "::error::$name still had active deployments after 20 minutes."
            return 1
          }

          trigger_deploy() {
            local id="$1" name="$2" body status
            body=$(curl -sS --max-time 30 -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"commitId\":\"$TARGET_COMMIT\"}" \
              -w $'\n%{http_code}' \
              "$RENDER_API_BASE/services/$id/deploys" || true)
            status="${body##*$'\n'}"
            body="${body%$'\n'*}"
            printf '%s' "$status" > "$RUNNER_TEMP/trigger-$id.status"
            printf '%s' "$body" > "$RUNNER_TEMP/trigger-$id.json"
            echo "$name deploy request returned HTTP ${status:-unknown}."
          }

          poll_deploy() {
            local id="$1" name="$2" deploy_id="$3" attempt body status commit
            for attempt in $(seq 1 120); do
              body=$(render_get "/services/$id/deploys/$deploy_id") || return 1
              status=$(printf '%s' "$body" | jq -r '(.deploy // .) | .status')
              commit=$(printf '%s' "$body" | jq -r '(.deploy // .) | .commit.id')
              if [ "$commit" != "$TARGET_COMMIT" ]; then
                echo "::error::$name deployment $deploy_id references commit $commit, not $TARGET_COMMIT."
                return 1
              fi
              if [ "$status" = "live" ]; then
                echo "$name deployment $deploy_id is live."
                return 0
              fi
              if is_terminal_status "$status"; then
                echo "::error::$name deployment $deploy_id ended as $status."
                return 1
              fi
              sleep 10
            done
            echo "::error::$name deployment $deploy_id did not reach live within 20 minutes (last status: ${status:-unknown})."
            return 1
          }
          RENDER_HELPERS

      - name: Verify Render services and wait for idle
        id: preflight
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/render.sh"

          for entry in "$RENDER_API_SERVICE_ID:chat-app-api:web_service" "$RENDER_WEB_SERVICE_ID:chat-app-web:static_site"; do
            id="${entry%%:*}"
            rest="${entry#*:}"
            name="${rest%%:*}"
            type="${rest#*:}"
            service=$(render_get "/services/$id") || exit 1
            actual_name=$(printf '%s' "$service" | jq -r '.name')
            actual_type=$(printf '%s' "$service" | jq -r '.type')
            if [ "$actual_name" != "$name" ] || [ "$actual_type" != "$type" ]; then
              fail "Service $id is $actual_name ($actual_type), expected $name ($type)."
            fi
            echo "Verified $name ($type) as $id."
          done

          wait_for_idle "$RENDER_API_SERVICE_ID" "chat-app-api"
          wait_for_idle "$RENDER_WEB_SERVICE_ID" "chat-app-web"

      - name: Trigger deployments for the tested commit
        id: trigger
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/render.sh"
          started_at=$(date -u +%s)

          trigger_deploy "$RENDER_API_SERVICE_ID" "chat-app-api"
          trigger_deploy "$RENDER_WEB_SERVICE_ID" "chat-app-web"

          resolve_deploy_id() {
            local id="$1" name="$2" response status attempt body matches count
            response="$RUNNER_TEMP/trigger-$id.json"
            status=$(cat "$RUNNER_TEMP/trigger-$id.status" 2>/dev/null || true)

            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && jq -e '(.id // .deploy.id)' "$response" >/dev/null 2>&1; then
              jq -r '(.id // .deploy.id)' "$response" > "$RUNNER_TEMP/deploy-id-$id"
              echo "$name deployment created: $(cat "$RUNNER_TEMP/deploy-id-$id")"
              return 0
            fi

            echo "$name trigger outcome is uncertain (HTTP ${status:-none}). Inspecting existing deployments instead of retrying."
            for attempt in $(seq 1 6); do
              body=$(render_get "/services/$id/deploys?limit=10") || return 1
              matches=$(printf '%s' "$body" | jq -r --arg sha "$TARGET_COMMIT" --argjson since "$((started_at - 120))" \
                '[ .[] | (.deploy // .) | select(.commit.id == $sha) | select(((.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) >= $since) | .id ] | .[]')
              count=$(printf '%s' "$matches" | grep -c . || true)
              if [ "$count" -eq 1 ]; then
                printf '%s' "$matches" > "$RUNNER_TEMP/deploy-id-$id"
                echo "$name deployment found after uncertain trigger: $matches"
                return 0
              fi
              if [ "$count" -gt 1 ]; then
                fail "$name trigger was uncertain and $count matching deployments were found. Refusing to guess."
              fi
              sleep 10
            done
            fail "$name trigger was uncertain and no matching deployment appeared. Refusing to retry automatically."
          }

          resolve_deploy_id "$RENDER_API_SERVICE_ID" "chat-app-api"
          resolve_deploy_id "$RENDER_WEB_SERVICE_ID" "chat-app-web"

          echo "API_DEPLOY_ID=$(cat "$RUNNER_TEMP/deploy-id-$RENDER_API_SERVICE_ID")" >> "$GITHUB_ENV"
          echo "WEB_DEPLOY_ID=$(cat "$RUNNER_TEMP/deploy-id-$RENDER_WEB_SERVICE_ID")" >> "$GITHUB_ENV"

      - name: Wait for both deployments to go live
        id: poll
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/render.sh"
          poll_deploy "$RENDER_API_SERVICE_ID" "chat-app-api" "$API_DEPLOY_ID"
          poll_deploy "$RENDER_WEB_SERVICE_ID" "chat-app-web" "$WEB_DEPLOY_ID"

      - name: Verify production health
        id: health
        run: |
          set -euo pipefail
          api="https://chat-app-api-ku3h.onrender.com"
          web="https://chat-app-web-ywez.onrender.com"

          wait_for_200() {
            local url="$1" attempt code
            for attempt in $(seq 1 60); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$url did not return 200 (last status: ${code:-none})."
            return 1
          }

          healthz_ok=0
          for attempt in $(seq 1 60); do
            body=$(curl -sS --max-time 30 -w $'\n%{http_code}' "$api/healthz" || true)
            code="${body##*$'\n'}"
            json="${body%$'\n'*}"
            if [ "$code" = "200" ] && printf '%s' "$json" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              healthz_ok=1
              break
            fi
            sleep 5
          done
          [ "$healthz_ok" -eq 1 ] || fail "API /healthz did not return 200 with status ok."
          echo "API /healthz is ok."

          wait_for_200 "$api/readyz"
          echo "API /readyz is 200."

          wait_for_200 "$web/"
          echo "Frontend root is 200."

          headers=$(curl -sS -D - -o /dev/null --max-time 30 "$web/" || true)
          printf '%s' "$headers" | grep -qi '^content-security-policy:' || fail "The frontend response has no Content-Security-Policy header."
          printf '%s' "$headers" | grep -qi "default-src 'self'" || fail "The frontend CSP is missing default-src 'self'."
          printf '%s' "$headers" | grep -qi "frame-ancestors 'none'" || fail "The frontend CSP is missing frame-ancestors 'none'."
          echo "Frontend CSP is present and has the expected directives."

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Deployment result: ${{ job.status }}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Target commit | \`$TARGET_COMMIT\` |"
            echo "| API deployment | ${API_DEPLOY_ID:-not created} |"
            echo "| Static site deployment | ${WEB_DEPLOY_ID:-not created} |"
            echo "| Commit verification | ${{ steps.commit.outcome }} |"
            echo "| Idle preflight | ${{ steps.preflight.outcome }} |"
            echo "| Trigger | ${{ steps.trigger.outcome }} |"
            echo "| Both live | ${{ steps.poll.outcome }} |"
            echo "| Production health | ${{ steps.health.outcome }} |"
            echo ""
            echo "Deployed by GitHub Actions after Verify succeeded; Render auto-deploy remains off."
          } >> "$GITHUB_STEP_SUMMARY"
